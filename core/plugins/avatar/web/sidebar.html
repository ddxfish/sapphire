<style>
    #avatar-display.avatar-fullwindow {
        position: fixed !important;
        inset: 0 !important;
        z-index: 9999 !important;
        background: #000 !important;
        border-radius: 0 !important;
        padding: 0 !important;
    }
    @media (max-width: 768px) {
        #avatar-display.avatar-fullwindow {
            bottom: 56px !important; /* clear mobile nav rail */
        }
    }
    #avatar-display.avatar-fullwindow #avatar-canvas {
        width: 100% !important;
        height: 100% !important;
        border-radius: 0 !important;
    }
    #avatar-display:fullscreen {
        background: #000;
    }
    #avatar-display:fullscreen #avatar-canvas {
        width: 100%;
        height: 100%;
        border-radius: 0;
    }
    #avatar-controls {
        position: absolute;
        top: 6px;
        right: 6px;
        display: flex;
        gap: 4px;
        z-index: 2;
        opacity: 0;
        transition: opacity 0.2s;
    }
    #avatar-display:hover #avatar-controls,
    #avatar-display.avatar-fullwindow #avatar-controls,
    #avatar-display:fullscreen #avatar-controls {
        opacity: 1;
    }
    .avatar-ctrl-btn {
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 4px;
        background: rgba(0,0,0,0.5);
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
        line-height: 1;
        padding: 0;
    }
    .avatar-ctrl-btn:hover {
        background: rgba(74,158,255,0.6);
    }
    /* Hide player button + location dropdown in sidebar mode (only show expanded) */
    #avatar-btn-player,
    #avatar-location-select {
        display: none;
    }
    #avatar-display.avatar-fullwindow #avatar-btn-player,
    #avatar-display:fullscreen #avatar-btn-player,
    #avatar-display.avatar-fullwindow #avatar-location-select,
    #avatar-display:fullscreen #avatar-location-select {
        display: flex;
    }

    .avatar-ctrl-btn.orbit-active,
    .avatar-ctrl-btn.face-active,
    .avatar-ctrl-btn.player-active {
        background: rgba(74,158,255,0.35);
        border: 1px solid rgba(74,158,255,0.5);
    }

    /* Crosshair in player mode */
    #avatar-crosshair {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: rgba(255,255,255,0.5);
        box-shadow: 0 0 4px rgba(255,255,255,0.2);
        pointer-events: none;
        z-index: 5;
    }
    #avatar-display.player-mode #avatar-crosshair {
        display: block;
    }

    /* Fullwindow STT mic */
    #avatar-mic {
        display: none;
        position: absolute;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        width: 56px;
        height: 56px;
        border: 2px solid rgba(74,158,255,0.4);
        border-radius: 50%;
        background: rgba(0,0,0,0.6);
        color: #fff;
        font-size: 24px;
        cursor: pointer;
        backdrop-filter: blur(4px);
        transition: background 0.15s, border-color 0.15s;
        user-select: none;
        -webkit-user-select: none;
    }
    #avatar-mic:hover { border-color: rgba(74,158,255,0.8); }
    #avatar-mic.recording {
        background: rgba(255,50,50,0.5);
        border-color: rgba(255,50,50,0.8);
    }
    #avatar-mic.tts-playing {
        background: rgba(74,158,255,0.3);
    }
    #avatar-display.avatar-fullwindow #avatar-mic,
    #avatar-display:fullscreen #avatar-mic {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* ═══ Chat overlay (WoW-style) ═══ */
    #avatar-chat {
        display: none;
        position: absolute;
        bottom: 16px;
        left: 16px;
        z-index: 4;
        width: 800px;
        max-width: 30vw;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #avatar-display.avatar-fullwindow #avatar-chat,
    #avatar-display:fullscreen #avatar-chat {
        display: flex;
        flex-direction: column;
    }

    /* Chat log */
    #avatar-chat-log {
        max-height: 260px;
        overflow-y: auto;
        padding: 10px 12px;
        background: rgba(0,0,0,0.35);
        backdrop-filter: blur(4px);
        border-radius: 8px 8px 0 0;
        scrollbar-width: thin;
        scrollbar-color: rgba(255,255,255,0.15) transparent;
        transition: max-height 0.3s, padding 0.3s, opacity 0.3s;
    }
    #avatar-chat.collapsed #avatar-chat-log {
        max-height: 0;
        padding: 0 12px;
        opacity: 0;
        overflow: hidden;
    }

    .chat-msg {
        margin: 3px 0;
        font-size: 13px;
        line-height: 1.4;
        word-wrap: break-word;
    }
    .chat-msg-user {
        color: rgba(180,220,255,0.9);
    }
    .chat-msg-user::before {
        content: 'You: ';
        color: rgba(120,170,255,0.7);
        font-weight: 600;
    }
    .chat-msg-ai {
        color: rgba(220,220,230,0.85);
    }
    .chat-msg-ai::before {
        content: 'Sapphire: ';
        color: rgba(74,158,255,0.7);
        font-weight: 600;
    }
    .chat-msg-system {
        color: rgba(180,180,180,0.5);
        font-size: 11px;
        font-style: italic;
    }

    /* Chat toolbar bar */
    #avatar-chat-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        background: rgba(0,0,0,0.4);
        backdrop-filter: blur(4px);
        border-radius: 0 0 8px 8px;
    }
    #avatar-chat.collapsed #avatar-chat-bar {
        border-radius: 8px;
    }

    .chat-bar-btn {
        border: none;
        border-radius: 4px;
        background: rgba(255,255,255,0.1);
        color: rgba(255,255,255,0.7);
        font-size: 12px;
        padding: 4px 10px;
        cursor: pointer;
        white-space: nowrap;
    }
    .chat-bar-btn:hover {
        background: rgba(255,255,255,0.2);
        color: #fff;
    }
    .chat-bar-btn.stop-btn {
        color: rgba(255,100,100,0.9);
        display: none;
    }
    .chat-bar-btn.stop-btn.visible {
        display: inline-block;
    }

    #avatar-chat-volume {
        width: 70px;
        height: 3px;
        -webkit-appearance: none;
        appearance: none;
        background: rgba(255,255,255,0.15);
        border-radius: 2px;
        outline: none;
        cursor: pointer;
    }
    #avatar-chat-volume::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: rgba(74,158,255,0.8);
        cursor: pointer;
    }
    #avatar-chat-volume::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: rgba(74,158,255,0.8);
        border: none;
        cursor: pointer;
    }
    .chat-bar-label {
        color: rgba(255,255,255,0.4);
        font-size: 11px;
        user-select: none;
    }
    .chat-bar-spacer { flex: 1; }
    .avatar-stage-btn {
        border: 1px solid var(--border); border-radius: 4px; background: var(--bg-secondary);
        color: var(--text); font-size: 12px; padding: 3px 8px; cursor: pointer; white-space: nowrap;
    }
    .avatar-stage-btn:hover { border-color: var(--trim, #4a9eff); }
</style>
<div id="avatar-display" style="position:relative; width:100%; padding:0;">
    <canvas id="avatar-canvas" style="width:100%; height:280px; display:block; border-radius:6px;"></canvas>
    <div id="avatar-controls">
        <select id="avatar-location-select" title="Location" style="
            height: 28px; border: none; border-radius: 4px;
            background: rgba(0,0,0,0.5); color: #fff; font-size: 11px;
            padding: 0 6px; cursor: pointer; backdrop-filter: blur(4px);
            outline: none;
        "></select>
        <button class="avatar-ctrl-btn" id="avatar-btn-player" title="Player mode (WASD)">&#x1F6B6;</button>
        <button class="avatar-ctrl-btn" id="avatar-btn-orbit" title="Toggle auto-orbit">&#x27F3;</button>
        <button class="avatar-ctrl-btn" id="avatar-btn-face" title="Keep the camera on her face">&#x1F642;</button>
        <button class="avatar-ctrl-btn" id="avatar-btn-stage" title="Step into the chat">&#x1F4AC;</button>
        <button class="avatar-ctrl-btn" id="avatar-btn-expand" title="Expand">&#x2922;</button>
        <button class="avatar-ctrl-btn" id="avatar-btn-fullscreen" title="Fullscreen">&#x26F6;</button>
    </div>
    <div id="avatar-crosshair"></div>
    <button id="avatar-mic" title="Hold to talk">&#x1F3A4;</button>

    <!-- Chat overlay (WoW-style) -->
    <div id="avatar-chat">
        <div id="avatar-chat-log"></div>
        <div id="avatar-chat-bar">
            <button class="chat-bar-btn" id="avatar-chat-toggle" title="Toggle chat log">&#x25BC;</button>
            <button class="chat-bar-btn stop-btn" id="avatar-chat-stop" title="Stop generation">Stop</button>
            <span class="chat-bar-spacer"></span>
            <span class="chat-bar-label">Vol</span>
            <input type="range" id="avatar-chat-volume" min="0" max="100" value="80" title="Volume">
        </div>
    </div>

    <div id="avatar-status" style="position:absolute; bottom:4px; left:0; right:0; text-align:center; font-size:0.7rem; color:var(--text-muted); pointer-events:none;"></div>
</div>
<!-- Her control panel while she stands in the chat (stage.js) -->
<div id="avatar-stage-panel" style="display:none; font-size:0.85em;">
    <canvas id="avatar-stage-face" width="320" height="320" title="Her face, close up"
            style="display:block; width:100%; max-width:240px; aspect-ratio:1; margin:0 auto 6px; border-radius:8px; background:rgba(0,0,0,0.35);"></canvas>
    <label style="display:flex; align-items:center; gap:8px;">Size
        <input type="range" id="avatar-stage-size" min="8" max="95" step="1" value="20" style="flex:1;">
    </label>
    <label style="display:flex; align-items:center; gap:8px; margin-top:4px;" title="How solid she is where she crosses a message: 0 = hidden behind it, 100 = fully over the text">Ghost
        <input type="range" id="avatar-stage-ghost" min="0" max="100" step="5" value="30" style="flex:1;">
    </label>
    <label style="display:flex; align-items:center; gap:8px; margin-top:4px;">
        <input type="checkbox" id="avatar-stage-chair-on" style="margin:0;"> Chair
        <input type="range" id="avatar-stage-chair-x" min="0" max="100" step="1" value="88" style="flex:1;" title="Where along the back her chair stands">
    </label>
    <div style="display:flex; gap:14px; margin-top:4px;">
        <label style="display:flex; align-items:center; gap:6px;"><input type="checkbox" id="avatar-stage-couch" style="margin:0;"> Couch (left)</label>
        <label style="display:flex; align-items:center; gap:6px;"><input type="checkbox" id="avatar-stage-desk" style="margin:0;"> Desk (right)</label>
    </div>
    <div style="display:flex; gap:4px; margin-top:6px; flex-wrap:wrap;">
        <button class="avatar-stage-btn" data-go="go_left" title="Walk to the left edge">&#x25C0; Left</button>
        <button class="avatar-stage-btn" data-go="go_center">Center</button>
        <button class="avatar-stage-btn" data-go="go_right" title="Walk to the right edge">Right &#x25B6;</button>
        <button class="avatar-stage-btn" data-go="go_back" title="Walk deeper into the scene">Back</button>
        <button class="avatar-stage-btn" data-go="go_front" title="Come up front">Front</button>
        <button class="avatar-stage-btn" data-go="go_chair" title="Sit in her chair">Chair</button>
        <button class="avatar-stage-btn" data-go="go_couch">Couch</button>
        <button class="avatar-stage-btn" data-go="go_desk">Desk</button>
        <button class="avatar-stage-btn" id="avatar-stage-back" style="margin-left:auto;">To sidebar</button>
    </div>
</div>
<!-- Enabled switch (Krem 2026-08-23): off = the 3D scene is torn down (the
     browser's GPU share comes back, the render loop stops) AND the prompt
     instructions stop — one switch, both halves. Stored server-side. -->
<label id="avatar-enabled-row" style="display:flex; align-items:center; gap:8px; margin-top:6px; font-size:0.85em; cursor:pointer;">
    <input type="checkbox" id="avatar-enabled" checked style="margin:0;">
    <span>Enabled</span>
    <span id="avatar-enabled-note" style="color:var(--text-muted); font-size:0.9em; display:none;">— off: no render, no prompt instructions</span>
</label>
